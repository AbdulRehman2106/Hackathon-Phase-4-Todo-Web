apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: todo-app
  labels:
    app: todo-app
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: todo-app
    component: frontend
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  sessionAffinity: None
