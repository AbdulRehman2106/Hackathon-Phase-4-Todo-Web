# Frontend Helm Values Contract

**Chart**: todo-frontend
**Version**: 1.0.0
**Purpose**: Configuration schema for frontend Helm chart

## Values Schema

```yaml
# Replica configuration
replicaCount: 2  # Min: 1, Max: 10, Default: 2

# Container image configuration
image:
  repository: todo-frontend  # Image name (without tag)
  tag: latest                # Image tag
  pullPolicy: IfNotPresent   # Options: Always, IfNotPresent, Never

# Service configuration
service:
  type: ClusterIP            # Options: ClusterIP, NodePort, LoadBalancer
  port: 3000                 # Service port
  targetPort: 3000           # Container port

# Resource limits and requests
resources:
  requests:
    cpu: 100m                # CPU request (millicores)
    memory: 256Mi            # Memory request
  limits:
    cpu: 500m                # CPU limit (millicores)
    memory: 512Mi            # Memory limit

# Autoscaling configuration
autoscaling:
  enabled: true              # Enable HPA
  minReplicas: 2             # Minimum replicas
  maxReplicas: 5             # Maximum replicas
  targetCPUUtilizationPercentage: 80  # Target CPU %

# Health check configuration
livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# Application configuration (non-sensitive)
config:
  apiUrl: "http://todo-backend:8000"  # Backend service URL
  logLevel: "info"                     # Options: debug, info, warn, error
  environment: "production"            # Options: development, production

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Ingress configuration (optional)
ingress:
  enabled: false             # Enable ingress
  className: nginx           # Ingress class
  host: todo.local          # Hostname
  path: /                   # Path prefix
  pathType: Prefix          # Options: Prefix, Exact

# Node selector (optional)
nodeSelector: {}

# Tolerations (optional)
tolerations: []

# Affinity rules (optional)
affinity: {}
```

## Required Values

The following values MUST be provided:
- `image.repository`: Container image name
- `image.tag`: Container image tag
- `config.apiUrl`: Backend API endpoint

## Optional Values

All other values have sensible defaults and can be omitted.

## Value Constraints

| Field | Type | Constraint | Default |
|-------|------|------------|---------|
| replicaCount | integer | 1-10 | 2 |
| service.port | integer | 1-65535 | 3000 |
| resources.requests.cpu | string | Valid CPU units | 100m |
| resources.requests.memory | string | Valid memory units | 256Mi |
| resources.limits.cpu | string | Valid CPU units | 500m |
| resources.limits.memory | string | Valid memory units | 512Mi |
| autoscaling.minReplicas | integer | 1-10 | 2 |
| autoscaling.maxReplicas | integer | 1-10 | 5 |
| autoscaling.targetCPUUtilizationPercentage | integer | 1-100 | 80 |
| config.logLevel | string | debug\|info\|warn\|error | info |
| config.environment | string | development\|production | production |

## Example Usage

### Minimal Configuration
```yaml
image:
  repository: todo-frontend
  tag: v1.0.0

config:
  apiUrl: "http://todo-backend:8000"
```

### Development Configuration
```yaml
replicaCount: 1

image:
  repository: todo-frontend
  tag: dev
  pullPolicy: Always

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

config:
  apiUrl: "http://todo-backend:8000"
  logLevel: "debug"
  environment: "development"
```

### Production Configuration
```yaml
replicaCount: 3

image:
  repository: todo-frontend
  tag: v1.0.0
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  apiUrl: "http://todo-backend:8000"
  logLevel: "info"
  environment: "production"

ingress:
  enabled: true
  className: nginx
  host: todo.example.com
  path: /
```

## Validation

Helm chart includes validation for:
- Required fields presence
- Value type correctness
- Constraint satisfaction
- Resource format validity

Run validation:
```bash
helm lint ./helm/frontend
helm template ./helm/frontend --values values.yaml --dry-run
```

