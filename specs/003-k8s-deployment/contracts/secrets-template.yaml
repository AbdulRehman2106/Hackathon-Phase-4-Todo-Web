# Kubernetes Secrets Template

**Purpose**: Template and instructions for creating Kubernetes Secrets required by the backend service

## Overview

The backend application requires three sensitive values stored in a Kubernetes Secret:
1. **Database URL**: PostgreSQL connection string
2. **Cohere API Key**: API key for Cohere AI service
3. **JWT Secret**: Secret key for JWT token signing

## Secret Structure

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
type: Opaque
data:
  # All values must be base64-encoded
  database_url: <BASE64_ENCODED_DATABASE_URL>
  cohere_api_key: <BASE64_ENCODED_COHERE_API_KEY>
  jwt_secret: <BASE64_ENCODED_JWT_SECRET>
```

## Creation Methods

### Method 1: Using kubectl (Recommended)

This method automatically handles base64 encoding:

```bash
kubectl create secret generic backend-secrets \
  --from-literal=database_url="postgresql://user:password@host:5432/dbname" \
  --from-literal=cohere_api_key="your-cohere-api-key-here" \
  --from-literal=jwt_secret="your-jwt-secret-here"
```

**Advantages**:
- Automatic base64 encoding
- No intermediate files
- Simple one-line command

### Method 2: From Environment Variables

```bash
kubectl create secret generic backend-secrets \
  --from-literal=database_url="$DATABASE_URL" \
  --from-literal=cohere_api_key="$COHERE_API_KEY" \
  --from-literal=jwt_secret="$JWT_SECRET"
```

### Method 3: From File

Create a `.env` file (DO NOT COMMIT):
```bash
# .env.secrets (add to .gitignore)
DATABASE_URL=postgresql://user:password@host:5432/dbname
COHERE_API_KEY=your-cohere-api-key-here
JWT_SECRET=your-jwt-secret-here
```

Then create secret:
```bash
kubectl create secret generic backend-secrets --from-env-file=.env.secrets
```

### Method 4: Manual YAML (Not Recommended)

If you must create YAML manually:

1. Base64 encode each value:
```bash
echo -n "postgresql://user:password@host:5432/dbname" | base64
echo -n "your-cohere-api-key-here" | base64
echo -n "your-jwt-secret-here" | base64
```

2. Create YAML file:
```yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
data:
  database_url: cG9zdGdyZXNxbDovL3VzZXI6cGFzc3dvcmRAaG9zdDo1NDMyL2RibmFtZQ==
  cohere_api_key: eW91ci1jb2hlcmUtYXBpLWtleS1oZXJl
  jwt_secret: eW91ci1qd3Qtc2VjcmV0LWhlcmU=
```

3. Apply:
```bash
kubectl apply -f backend-secrets.yaml
```

**Warning**: Never commit this file to Git!

## Value Formats

### Database URL Format

```
postgresql://[user]:[password]@[host]:[port]/[database]?[options]
```

**Example**:
```
postgresql://todouser:securepass@db.example.com:5432/tododb?sslmode=require
```

**For Neon PostgreSQL**:
```
postgresql://user:password@ep-cool-name-123456.us-east-2.aws.neon.tech/neondb?sslmode=require
```

### Cohere API Key Format

Obtain from: https://dashboard.cohere.com/api-keys

**Format**: Alphanumeric string, typically 40+ characters
**Example**: `abc123def456ghi789jkl012mno345pqr678stu901`

### JWT Secret Format

Generate a secure random string:

```bash
# Using OpenSSL
openssl rand -base64 32

# Using Python
python3 -c "import secrets; print(secrets.token_urlsafe(32))"

# Using Node.js
node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
```

**Requirements**:
- Minimum 32 characters
- High entropy (random)
- Never reuse across environments

## Verification

### Check Secret Exists
```bash
kubectl get secret backend-secrets
```

### View Secret Keys (not values)
```bash
kubectl describe secret backend-secrets
```

### Decode Secret Values (for debugging)
```bash
# View all decoded values
kubectl get secret backend-secrets -o jsonpath='{.data.database_url}' | base64 --decode
kubectl get secret backend-secrets -o jsonpath='{.data.cohere_api_key}' | base64 --decode
kubectl get secret backend-secrets -o jsonpath='{.data.jwt_secret}' | base64 --decode
```

**Warning**: Only run these commands in secure environments!

## Security Best Practices

### DO:
- ✅ Use `kubectl create secret` (automatic encoding)
- ✅ Store secrets in password manager
- ✅ Use different secrets per environment
- ✅ Rotate secrets regularly
- ✅ Add `.env.secrets` to `.gitignore`
- ✅ Use RBAC to restrict secret access
- ✅ Enable etcd encryption at rest

### DON'T:
- ❌ Commit secrets to Git
- ❌ Share secrets in chat/email
- ❌ Reuse secrets across environments
- ❌ Use weak JWT secrets
- ❌ Log secret values
- ❌ Include secrets in container images

## Updating Secrets

### Update Single Value
```bash
kubectl create secret generic backend-secrets \
  --from-literal=cohere_api_key="new-api-key" \
  --dry-run=client -o yaml | kubectl apply -f -
```

### Replace Entire Secret
```bash
kubectl delete secret backend-secrets
kubectl create secret generic backend-secrets \
  --from-literal=database_url="$DATABASE_URL" \
  --from-literal=cohere_api_key="$COHERE_API_KEY" \
  --from-literal=jwt_secret="$JWT_SECRET"
```

**Note**: Pods must be restarted to pick up new secret values:
```bash
kubectl rollout restart deployment/todo-backend
```

## Troubleshooting

### Secret Not Found
```bash
# Check if secret exists
kubectl get secrets

# Check namespace
kubectl get secrets -n default

# Create if missing
kubectl create secret generic backend-secrets --from-literal=...
```

### Invalid Base64 Encoding
```bash
# Verify encoding
kubectl get secret backend-secrets -o yaml

# Each value should be valid base64
echo "cG9zdGdyZXNxbDovL..." | base64 --decode
```

### Pod Can't Access Secret
```bash
# Check pod events
kubectl describe pod <pod-name>

# Check secret mount
kubectl exec <pod-name> -- env | grep DATABASE_URL

# Verify RBAC permissions
kubectl auth can-i get secrets --as=system:serviceaccount:default:default
```

## Example: Complete Setup

```bash
# 1. Set environment variables
export DATABASE_URL="postgresql://user:pass@neon.tech:5432/db?sslmode=require"
export COHERE_API_KEY="your-cohere-api-key"
export JWT_SECRET=$(openssl rand -base64 32)

# 2. Create secret
kubectl create secret generic backend-secrets \
  --from-literal=database_url="$DATABASE_URL" \
  --from-literal=cohere_api_key="$COHERE_API_KEY" \
  --from-literal=jwt_secret="$JWT_SECRET"

# 3. Verify
kubectl get secret backend-secrets

# 4. Deploy backend (secret will be mounted automatically)
helm install todo-backend ./helm/backend

# 5. Verify pod has secrets
kubectl exec deployment/todo-backend -- env | grep -E "DATABASE_URL|COHERE_API_KEY|JWT_SECRET"
```

## Template Checklist

Before deploying:
- [ ] Database URL is correct and accessible from cluster
- [ ] Cohere API key is valid and has sufficient quota
- [ ] JWT secret is strong (32+ characters, high entropy)
- [ ] Secret created in correct namespace
- [ ] Secret name matches Helm values (`backend-secrets`)
- [ ] All three keys present: `database_url`, `cohere_api_key`, `jwt_secret`
- [ ] Values are properly base64 encoded (if using YAML)
- [ ] Secret not committed to Git
- [ ] `.env.secrets` added to `.gitignore`

